<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कंप्यूटर टेस्ट 1 - Medhavi Study Point</title>

  <!-- 🔒 एक्सेस कंट्रोल कोड (GS और FULL बैच दोनों के लिए) -->
  <script>
    const userPlan = localStorage.getItem("user_plan");
    if (userPlan !== "FULL" && userPlan !== "GS") {
      alert("इस टेस्ट को देखने के लिए कृपया पहले लॉगिन करें या GS बैच जॉइन करें!");
      window.location.href = "../gs.html"; // वापस लॉगिन/पेमेंट पेज पर रीडायरेक्ट करेगा
    }
  </script>

  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #0b1e47; margin-bottom: 20px; }
    .question { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #e2e8f0; }
    .question p { font-weight: bold; margin-bottom: 10px; }
    .options label { display: block; margin: 8px 0; padding: 10px; background: #f1f5f9; border-radius: 6px; cursor: pointer; }
    .options input { margin-right: 10px; }
    .btn { display: block; width: 100%; padding: 12px; background: #0b1e47; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn:hover { background: #1e3a8a; }
    #result { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; color: #16a34a; }
  </style>
</head>
<body>

<div class="container">
  <h2>🖥️ कंप्यूटर ऑनलाइन टेस्ट - 1</h2>

  <form id="quizForm">
    <!-- प्रश्न 1 -->
    <div class="question">
      <p>1. कंप्यूटर का मस्तिष्क (Brain) किसे कहा जाता है?</p>
      <div class="options">
        <label><input type="radio" name="q1" value="RAM"> RAM</label>
        <label><input type="radio" name="q1" value="CPU"> CPU</label>
        <label><input type="radio" name="q1" value="Hard Disk"> Hard Disk</label>
        <label><input type="radio" name="q1" value="Monitor"> Monitor</label>
      </div>
    </div>

    <!-- प्रश्न 2 -->
    <div class="question">
      <p>2. निम्नलिखित में से कौन-सी एक इनपुट डिवाइस (Input Device) है?</p>
      <div class="options">
        <label><input type="radio" name="q2" value="Printer"> Printer</label>
        <label><input type="radio" name="q2" value="Monitor"> Monitor</label>
        <label><input type="radio" name="q2" value="Keyboard"> Keyboard</label>
        <label><input type="radio" name="q2" value="Speaker"> Speaker</label>
      </div>
    </div>

    <!-- प्रश्न 3 -->
    <div class="question">
      <p>3. WWW का पूर्ण रूप (Full Form) क्या है?</p>
      <div class="options">
        <label><input type="radio" name="q3" value="World Wide Web"> World Wide Web</label>
        <label><input type="radio" name="q3" value="World Wide Words"> World Wide Words</label>
        <label><input type="radio" name="q3" value="Web World Wide"> Web World Wide</label>
        <label><input type="radio" name="q3" value="World Web Wide"> World Web Wide</label>
      </div>
    </div>

    <!-- प्रश्न 4 -->
    <div class="question">
      <p>4. कंप्यूटर में अस्थाई (Volatile) मेमोरी किसे कहा जाता है?</p>
      <div class="options">
        <label><input type="radio" name="q4" value="ROM"> ROM</label>
        <label><input type="radio" name="q4" value="RAM"> RAM</label>
        <label><input type="radio" name="q4" value="HDD"> HDD</label>
        <label><input type="radio" name="q4" value="SSD"> SSD</label>
      </div>
    </div>

    <!-- प्रश्न 5 -->
    <div class="question">
      <p>5. 1 किलोबाइट (1 KB) कितने बाइट्स के बराबर होता है?</p>
      <div class="options">
        <label><input type="radio" name="q5" value="1000"> 1000 Bytes</label>
        <label><input type="radio" name="q5" value="1024"> 1024 Bytes</label>
        <label><input type="radio" name="q5" value="512"> 512 Bytes</label>
        <label><input type="radio" name="q5" value="2048"> 2048 Bytes</label>
      </div>
    </div>

    <button type="button" class="btn" onclick="submitQuiz()">सबमिट करें</button>
  </form>

  <div id="result"></div>
</div>

<script>
  function submitQuiz() {
    const answers = { q1: "CPU", q2: "Keyboard", q3: "World Wide Web", q4: "RAM", q5: "1024" };
    let score = 0;
    let total = 5;

    for (let i = 1; i <= total; i++) {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if (selected && selected.value === answers[`q${i}`]) {
        score++;
      }
    }

    document.getElementById("result").innerHTML = `आपका स्कोर: ${score} / ${total}`;
  }
</script>

</body>
</html>
