<!DOCTYPE html>
<html lang="hi">
<head>

    <title>TGT 2026 Batch - Medhavi Study Point</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; }
        .hero { background: linear-gradient(135deg, #0b1e47, #1e3a8a); color: white; padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }

        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #0b1e47; background: #e2e8f0; padding: 8px 16px; border-radius: 8px; font-weight: bold; }
        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .main-card { background: white; padding: 30px; border-radius: 16px; text-align: center; border: 2px solid #e2e8f0; text-decoration: none; color: #1e293b; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .main-card:hover { transform: translateY(-5px); border-color: #ffcc00; }
        .main-card i { font-style: normal; font-size: 40px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

            <!-- 4. Home Science Daily Test Button (📋 इमोजी के साथ) -->
